[project]
name = "yt-video-doc"
version = "0.1.0"
description = "Read YouTube videos as timestamped transcript documents through a CLI or MCP server."
readme = "README.md"
requires-python = ">=3.10,<3.15"
authors = [{ name = "mcordier", email = "matt.cordier@icloud.com" }]
dependencies = [
    "mcp[cli]>=1.20.0,<2.0.0",
    "youtube-transcript-api>=1.2.4,<2.0.0",
    "yt-dlp>=2025.1.15,<2027",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5,<9.0.0",
]

[project.scripts]
yt-video = "yt_video_doc.cli:main"
yt-video-mcp = "yt_video_doc.mcp_server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["yt_video_doc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
